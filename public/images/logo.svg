<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 88" width="420" height="88" fill="none">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="dm-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="35%" stop-color="#7C3AED" />
      <stop offset="75%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="dm-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <linearGradient id="dm-circuit-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- Brand Icon / Circuit Monogram (Left side) -->
  <g transform="translate(10, 8)">
    <!-- Circuit Base Node Background -->
    <rect x="2" y="2" width="68" height="68" rx="18" fill="url(#dm-primary-grad)" />
    
    <!-- Circuit Overlay Pattern -->
    <path d="M12 24 L24 24 L30 18 L46 18" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="46" cy="18" r="2.5" fill="#38BDF8" />
    
    <path d="M60 48 L48 48 L42 54 L26 54" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="26" cy="54" r="2.5" fill="#F472B6" />
    
    <path d="M22 60 L22 46 L28 40" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />
    <circle cx="22" cy="60" r="2" fill="#FFFFFF" />

    <!-- Stylized DM & Digital Shopping Node -->
    <!-- 'D' Loop -->
    <path d="M24 22 L36 22 C44 22 49 26.5 49 35 C49 43.5 44 48 36 48 L24 48 Z" 
          stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" fill="none" />
    <path d="M24 22 L24 48" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

    <!-- 'M' / Circuit Bridge inside 'D' -->
    <path d="M28 44 L28 28 L35 37 L42 28 L42 44" 
          stroke="#FDF4FF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Glowing Tech Node Dots -->
    <circle cx="35" cy="37" r="2" fill="#F43F5E" />
    <circle cx="36" cy="22" r="3" fill="#38BDF8" />
    <circle cx="36" cy="48" r="3" fill="#E879F9" />
  </g>

  <!-- Typography: DIGITAL MART BD -->
  <g transform="translate(94, 20)">
    <!-- Main Title -->
    <text x="0" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5">
      <tspan fill="#0F172A">DIGITAL </tspan>
      <tspan fill="url(#dm-primary-grad)">MART</tspan>
    </text>

    <!-- BD Tag -->
    <g transform="translate(225, 7)">
      <rect x="0" y="0" width="46" height="26" rx="6" fill="url(#dm-accent-grad)" />
      <text x="23" y="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">BD</text>
    </g>

    <!-- Brand Tagline -->
    <text x="2" y="47" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10.5" fill="#64748B" letter-spacing="1.8">
      PREMIUM DIGITAL TOOLS &amp; SERVICES
    </text>
  </g>
</svg>
